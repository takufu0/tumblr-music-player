<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tumblr Vinyl Music Player</title>
<script src="https://cdn.embed.ly/player-0.1.0.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;
  background: transparent;
}

/* MAIN PLAYER */

#tm-player {
  position: fixed;
  left: 15px;
  top: 15px;
  width: 330px;
  max-width: 100vw;
  overflow: visible;
  isolation: isolate;
  z-index: 999999;
  padding: 16px;
  background-color: #171619;
  color: #e6e0df;
  border: 2px solid #0d0d0d;
  border-radius: 5px;
  box-shadow:
    0 0 0 3px #17151a,
    0 0 0 4px #000000,
    0 12px 35px rgba(0,0,0,.85),
    inset 0 0 22px rgba(0,0,0,.8);
  transition:
    height 0.45s cubic-bezier(.22,.61,.36,1),
    width 0.45s ease,
    box-shadow 0.35s ease;
}

#tm-player.tm-dragging {
  transition: none;
}

#tm-player.hidden {
  display: none;
}

/* MARBLE BACKGROUND */

.tm-marble-bg {
  position: absolute !important;
  inset: 0;
  z-index: 0 !important;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
}

.tm-marble-bg img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

#tm-player > * {
  position: relative;
  z-index: 1;
}

#tm-player > .tm-marble-bg {
  position: absolute !important;
  inset: 0;
  z-index: 0 !important;
}

/* ORNAMENTAL FRAME */

#tm-player::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(33,33,33,.48);
  pointer-events: none;
  z-index: 10;
}

#tm-player::after {
  content: "";
  position: absolute;
  inset: -15px;
  pointer-events: none;
  z-index: 20;
  background-image:
    url("corner-tl.png"),
    url("corner-tr.png"),
    url("corner-bl.png"),
    url("corner-br.png");
  background-repeat: no-repeat;
  background-size: 85px 85px, 85px 85px, 85px 85px, 85px 85px;
  background-position: top left, top right, bottom left, bottom right;
}

#tm-player.minimized::after {
  inset: -13px;
  background-size: 65px 65px, 65px 65px, 65px 65px, 65px 65px;
}

/* HEADER */

#tm-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding: 0 3px 12px;
  border-bottom: 1px solid #716b73;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

#tm-header:active {
  cursor: grabbing;
}

.tm-header-title {
  color: #d0c5c6;
  font-family: Georgia, serif;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  text-shadow: 0 1px 5px #000;
}

.tm-header-title::before,
.tm-header-title::after {
  color: #c0b4b6;
}

.tm-header-title::before {
  content: "✧ ";
}

.tm-header-title::after {
  content: " ✧";
}

.tm-header-buttons {
  display: flex;
  gap: 6px;
}

.tm-header-buttons button {
  width: 25px;
  height: 25px;
  background: linear-gradient(145deg, #77717a, #29262d);
  color: #eee7e5;
  border: 1px solid #1b1a1a;
  border-radius: 2px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,.2);
  cursor: pointer;
  font-size: 15px;
}

.tm-header-buttons button:hover {
  background: #a69a9d;
  color: #171419;
}

/* ARTWORK AND VINYL */

#tm-artwork {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 5px 0 17px;
  overflow: visible;
}

#tm-vinyl {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 220px;
  height: 220px;
  max-width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  border: 5px solid #17151a;
  background: repeating-radial-gradient(
    circle at center,
    #050505 0px,
    #29272c 2px,
    #09090b 4px,
    #1a191e 6px,
    #050505 8px
  );
  box-shadow:
    0 8px 25px rgba(0,0,0,.9),
    0 0 0 2px #817980,
    inset 0 0 0 2px #100f0f;
  will-change: transform;
}

#tm-vinyl::before {
  content: "";
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.08);
  pointer-events: none;
}

#tm-vinyl::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.07);
  pointer-events: none;
}

#tm-vinyl-label {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 94px;
  height: 94px;
  overflow: hidden;
  border-radius: 50%;
  border: 3px solid #17151a;
  background: radial-gradient(circle, #c2b8b8, #49434b 75%);
  box-shadow: 0 0 0 1px #aaa0a1;
  z-index: 1;
}

#tm-cover {
  display: none;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tm-note {
  color: #28232b;
  font-size: 30px;
}

#tm-vinyl-spindle {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e1d8d5;
  border: 2px solid #55505a;
  z-index: 3;
  pointer-events: none;
}

/* TONEARM */

#tm-tonearm-svg {
  position: absolute;
  top: -5px;
  left: calc(58% - 1px);
  display: block;
  width: 120px;
  height: 150px;
  overflow: visible;
  z-index: 6;
  pointer-events: none;
}

#tone-arm {
  transform-box: view-box;
  transform-origin: 92px 24px;
  transform: rotate(-15deg);
  transition: transform .6s cubic-bezier(.4,0,.2,1);
}

#tm-artwork.is-playing #tone-arm {
  transform: rotate(8deg);
}

#tm-player.minimized #tm-tonearm-svg {
  display: none;
}

/* TRACK INFORMATION */

#tm-status {
  margin-top: -8px;
  margin-bottom: 12px;
  color: #a69ba1;
  font-family: Georgia, serif;
  font-size: 10px;
  font-style: italic;
  letter-spacing: 2px;
  text-align: center;
}

#tm-track {
  min-width: 0;
  margin-bottom: 15px;
  text-align: left;
}

#tm-title {
  margin-bottom: 5px;
  color: #e0d5d3;
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: normal;
  letter-spacing: .7px;
  text-shadow: 0 2px 5px #000;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#tm-subtitle {
  display: none;
  margin-top: -2px;
  margin-bottom: 5px;
  color: #aaa0a5;
  font-family: Georgia, serif;
  font-size: 10px;
  font-style: italic;
  letter-spacing: .5px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#tm-artist {
  color: #b9afb2;
  font-family: Georgia, serif;
  font-size: 12px;
  letter-spacing: .5px;
}

/* PROGRESS BAR */

#tm-progress-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
  color: #a5a5ad;
  font-size: 10px;
}

#tm-progress {
  flex: 1;
  min-width: 0;
  height: 4px;
  appearance: none;
  -webkit-appearance: none;
  background: linear-gradient(to right, #b9afb2, #39343d);
  border-radius: 10px;
  outline: none;
  cursor: pointer;
}

#tm-progress::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #d7ccca;
  box-shadow: 0 0 5px #aaa0a1;
}

#tm-progress::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border: 0;
  border-radius: 50%;
  background: #d7ccca;
  box-shadow: 0 0 5px #aaa0a1;
}

/* PLAYBACK CONTROLS */

#tm-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 17px;
  padding: 0 5px;
}

#tm-controls button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #c4b9bb;
  font-family: Georgia, serif;
  font-size: 18px;
  cursor: pointer;
  transition: color .2s, transform .2s, background .2s;
}

#tm-controls button:hover {
  color: #fff;
  transform: scale(1.12);
}

#tm-controls #tm-play {
  width: 47px;
  height: 47px;
  border: 2px solid #ded3d0;
  border-radius: 50%;
  background: linear-gradient(145deg, #bdb2b3, #514b55);
  color: #171419;
  font-size: 19px;
  box-shadow:
    0 3px 10px rgba(0,0,0,.7),
    inset 0 1px 3px rgba(255,255,255,.5);
}

#tm-controls #tm-play:hover {
  background: linear-gradient(145deg, #e3d9d6, #8c8188);
}

#tm-controls button.active {
  color: #e5c8cf;
}

/* PLAYLIST AND VOLUME TOOLS */

#tm-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 3px;
  border-top: 1px solid #6c646e;
  border-bottom: 1px solid rgb(28,28,28);
}

#tm-tools button {
  padding: 5px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #c1b5b8;
  font-family: Georgia, serif;
  font-size: 12px;
  letter-spacing: 1.5px;
  cursor: pointer;
}

#tm-tools button:hover,
#tm-tools button.active {
  color: #fff;
  background: rgba(190,180,190,.12);
}

.tm-tool-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  letter-spacing: 1px;
}

/* PLAYLIST */

#tm-playlist {
  display: none;
  max-height: 150px;
  margin-top: 10px;
  padding-top: 8px;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-top: 1px solid #756c75;
  scrollbar-color: #8b8089 #17151a;
}

#tm-playlist.open {
  display: block;
}

.tm-song {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 9px;
  border: 0;
  border-bottom: 1px solid rgba(180,170,180,.12);
  border-radius: 2px;
  background: transparent;
  color: #e0d7d8;
  font-family: Georgia, serif;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}

.tm-song:hover {
  background: rgba(190,180,190,.12);
}

.tm-song.active {
  background: linear-gradient(90deg, rgba(150,125,140,.22), transparent);
  color: #ead4dc;
  border-left: 2px solid #b7a5b1;
}

.tm-song-info {
  min-width: 0;
}

.tm-song-title {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tm-song-artist {
  display: block;
  margin-top: 3px;
  color: #a99da4;
  font-size: 10px;
  font-style: italic;
}

.tm-song-playing {
  flex-shrink: 0;
  color: #d6c3ce;
}

#tm-playlist::-webkit-scrollbar {
  width: 5px;
}

#tm-playlist::-webkit-scrollbar-track {
  background: #17151a;
}

#tm-playlist::-webkit-scrollbar-thumb {
  background: #827782;
  border-radius: 2px;
}

/* VOLUME PANEL */

#tm-volume-panel {
  display: none;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 12px 5px 3px;
  border-top: 1px solid #756c75;
  color: #d1c5c7;
  font-size: 13px;
}

#tm-volume-panel.open {
  display: flex;
}

#tm-volume {
  flex: 1;
  min-width: 0;
  accent-color: #b9aab3;
  cursor: pointer;
}

/* MINIMIZED PLAYER */

#tm-player.minimized {
  width: 270px;
  padding: 12px;
  border-radius: 4px;
}

#tm-player.minimized #tm-header {
  margin-bottom: 10px;
}

#tm-player.minimized #tm-content {
  display: grid;
  grid-template-columns: 64px minmax(0,1fr);
  align-items: center;
  gap: 10px;
}

#tm-player.minimized #tm-artwork {
  grid-column: 1;
  grid-row: 1;
  width: 64px;
  height: 64px;
  margin: 0;
  padding: 0;
}

#tm-player.minimized #tm-vinyl {
  width: 64px;
  height: 64px;
  border-width: 2px;
}

#tm-player.minimized #tm-vinyl-label {
  width: 28px;
  height: 28px;
  border-width: 1px;
}

#tm-player.minimized .tm-note {
  font-size: 12px;
}

#tm-player.minimized #tm-vinyl-spindle {
  width: 5px;
  height: 5px;
  border-width: 1px;
}

#tm-player.minimized #tm-vinyl::before {
  inset: 5px;
}

#tm-player.minimized #tm-vinyl::after {
  inset: 2px;
}

#tm-player.minimized #tm-track {
  grid-column: 2;
  grid-row: 1;
  min-width: 0;
  margin: 0;
}

#tm-player.minimized #tm-title {
  font-size: 13px;
}

#tm-player.minimized #tm-subtitle {
  margin-bottom: 3px;
  font-size: 9px;
}

#tm-player.minimized #tm-artist {
  font-size: 11px;
}

#tm-player.minimized #tm-progress-wrap,
#tm-player.minimized #tm-controls,
#tm-player.minimized #tm-tools,
#tm-player.minimized #tm-playlist,
#tm-player.minimized #tm-volume-panel,
#tm-player.minimized #tm-status {
  display: none !important;
}

/* REOPEN BUTTON */

#tm-player-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 999998;
  width: 45px;
  height: 45px;
  overflow: hidden;
  border: 2px solid #242020;
  border-radius: 50%;
  background:
    linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55)),
    url("marble.png");
  background-size: cover;
  background-position: center;
  box-shadow:
    0 3px 15px rgba(0,0,0,.8),
    inset 0 0 8px rgba(0,0,0,.7);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: filter 0.3s ease, border-color 0.3s ease;
}

#tm-player-toggle.visible {
  display: flex;
}

#tm-player-toggle:hover {
  border-color: #d8d0d0;
  filter: invert(1);
}

#tm-player-toggle img {
  display: block;
  width: 95%;
  height: 95%;
  object-fit: contain;
  pointer-events: none;
}

/* HIDDEN WHYP PLAYER */

#tm-whyp-host {
  position: fixed;
  left: -10000px;
  top: 0;
  width: 330px;
  height: 200px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: -1;
}
</style>
</head>

<body>

<div id="tm-player">

  <div class="tm-marble-bg" aria-hidden="true">
    <img src="marble.png" alt="">
  </div>

  <div id="tm-header">
    <div class="tm-header-title">NOW PLAYING ♫</div>

  <div id="tm-content">

      <svg id="tm-tonearm-svg" width="120" height="150" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="silver-metal" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#77777d"/>
            <stop offset="25%" stop-color="#eeeeF2"/>
            <stop offset="50%" stop-color="#aeb0b7"/>
            <stop offset="75%" stop-color="#f5f5f7"/>
            <stop offset="100%" stop-color="#77777d"/>
          </linearGradient>

          <linearGradient id="silver-weight" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f4f4f4"/>
            <stop offset="45%" stop-color="#aeb0b7"/>
            <stop offset="100%" stop-color="#66666d"/>
          </linearGradient>

          <filter id="tonearm-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.35"/>
          </filter>
        </defs>

        <g id="tone-arm">
          <circle cx="92" cy="24" r="14" fill="url(#silver-weight)" stroke="#55555b" stroke-width="1" filter="url(#tonearm-shadow)"/>
          <circle cx="92" cy="24" r="10" fill="none" stroke="#eeeeee" stroke-width="1" opacity="0.6"/>
          <circle cx="92" cy="24" r="3" fill="#66666d"/>

          <line x1="92" y1="32" x2="72" y2="114" stroke="url(#silver-metal)" stroke-width="5" stroke-linecap="round" filter="url(#tonearm-shadow)"/>

          <g transform="translate(68, 106) rotate(-18)">
            <rect x="0" y="0" width="11" height="22" rx="2" fill="url(#silver-metal)" stroke="#66666d" stroke-width="0.7"/>
            <rect x="1" y="16" width="9" height="6" rx="1" fill="#171419"/>
          </g>
        </g>
      </svg>
    </div>

    <div id="tm-status">Ready</div>

    <div id="tm-track">
      <div id="tm-title">Loading...</div>
      <div id="tm-subtitle"></div>
      <div id="tm-artist"></div>
    </div>

    <div id="tm-progress-wrap">
      <span id="tm-current">0:00</span>
      <input type="range" id="tm-progress" min="0" max="100" value="0">
      <span id="tm-duration">0:00</span>
    </div>

    <div id="tm-controls">
      <button id="tm-shuffle" title="Shuffle">⤨</button>
      <button id="tm-prev" title="Previous">|◀</button>
      <button id="tm-play" title="Play">▶</button>
      <button id="tm-next" title="Next">▶|</button>
      <button id="tm-loop" title="Repeat">↻</button>
    </div>

    <div id="tm-tools">
      <button id="tm-playlist-toggle" class="tm-tool-label" title="Open playlist">
        <span>☷</span>
        <span>PLAYLIST</span>
      </button>

      <button id="tm-volume-toggle" class="tm-tool-label" title="Volume">
        <span id="tm-volume-icon">♫</span>
        <span>VOLUME</span>
      </button>
    </div>

    <div id="tm-playlist"></div>

    <div id="tm-volume-panel">
      <span id="tm-volume-icon-label">♫</span>
      <input type="range" id="tm-volume" min="0" max="100" value="70">
    </div>

  </div>
</div>

<button id="tm-player-toggle" aria-label="Reopen music player">
  <img src="sheep.png" alt="">
</button>

const tm = document.getElementById("tm-player");
const tmTitle = document.getElementById("tm-title");
const tmSubtitle = document.getElementById("tm-subtitle");
const tmArtist = document.getElementById("tm-artist");
const tmPlay = document.getElementById("tm-play");
const tmProgress = document.getElementById("tm-progress");
const tmCurrent = document.getElementById("tm-current");
const tmDuration = document.getElementById("tm-duration");
const tmVolume = document.getElementById("tm-volume");
const tmStatus = document.getElementById("tm-status");
const tmPlaylist = document.getElementById("tm-playlist");
const tmCover = document.getElementById("tm-cover");
const tmNote = document.querySelector("#tm-vinyl-label .tm-note");
const tmVinyl = document.getElementById("tm-vinyl");
const tmArtwork = document.getElementById("tm-artwork");
const tmToggle = document.getElementById("tm-player-toggle");
const tmVolumePanel = document.getElementById("tm-volume-panel");

let currentSong = 0;
let whypFrame = null;
let whypPlayer = null;
let isPlaying = false;
let isShuffle = false;
let isLoop = false;
let isSeeking = false;
let knownDuration = 0;
let lastTimeUpdate = Date.now();
let tmStallChecker = null;
let stallWarningShown = false;

let tmParentViewport = {
  width: window.innerWidth,
  height: window.innerHeight
};

/* ==========================================
   PLAYER HEIGHT AND CONTENT ANIMATION
   ========================================== */

let tmHeightAnimationHandler = null;
let tmContentAnimation = null;

function tmAnimatePlayerHeight(updateFunction, animateContent = false) {

  const content = document.getElementById("tm-content");
  const currentHeight = tm.getBoundingClientRect().height;

  /*
    Only take the starting measurement when we are
    specifically animating from minimized to maximized.
  */
  const firstRect = animateContent
    ? content.getBoundingClientRect()
    : null;

  if (tmContentAnimation) {
    tmContentAnimation.cancel();
    tmContentAnimation = null;
  }

  if (tmHeightAnimationHandler) {
    tm.removeEventListener("transitionend", tmHeightAnimationHandler);
    tmHeightAnimationHandler = null;
  }

  tm.style.transition = "none";
  tm.style.height = currentHeight + "px";

  // Apply the new layout.
  updateFunction();

  tm.style.height = "auto";

  const targetHeight = tm.getBoundingClientRect().height;

  /*
    The content animation is only created when animateContent
    is true. Playlist and volume toggles won't trigger it.
  */
  if (animateContent) {

    const lastRect = content.getBoundingClientRect();

    const dx = firstRect.left - lastRect.left;
    const dy = firstRect.top - lastRect.top;

    const sx = lastRect.width
      ? firstRect.width / lastRect.width
      : 1;

    const sy = lastRect.height
      ? firstRect.height / lastRect.height
      : 1;

    if (lastRect.width > 0 && lastRect.height > 0) {

      tmContentAnimation = content.animate(
        [
          {
            transformOrigin: "top left",
            transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`
          },
          {
            transformOrigin: "top left",
            transform: "translate(0, 0) scale(1, 1)"
          }
        ],
        {
          duration: 450,
          easing: "cubic-bezier(.22,.61,.36,1)"
        }
      );

      tmContentAnimation.onfinish = () => {
        tmContentAnimation = null;
      };
    }
  }

  // Animate the outer player height.
  tm.style.height = currentHeight + "px";

  tm.offsetHeight;

  tm.style.transition = "";

  if (Math.abs(targetHeight - currentHeight) < 1) {
    tm.style.height = "auto";
    tmNotifyParentSize();
    return;
  }

  tmHeightAnimationHandler = function(event) {
    if (event.target !== tm || event.propertyName !== "height") return;

    tm.removeEventListener("transitionend", tmHeightAnimationHandler);
    tmHeightAnimationHandler = null;

    tm.style.height = "auto";

    tmNotifyParentSize();
  };

  tm.addEventListener("transitionend", tmHeightAnimationHandler);

  requestAnimationFrame(() => {
    tm.style.height = targetHeight + "px";
  });

  tmNotifyParentSize();
}

/* PARENT IFRAME SIZE NOTIFICATION */

let tmResizeQueued = false;

function tmNotifyParentSize() {
  if (tmResizeQueued) return;

  tmResizeQueued = true;

  requestAnimationFrame(() => {
    tmResizeQueued = false;

    const visibleElement = tm.classList.contains("hidden") ? tmToggle : tm;
    const rect = visibleElement.getBoundingClientRect();
    const extraSpace = 15;

    window.parent.postMessage({
      type: "tm-player-resize",
      width: Math.ceil(rect.width + extraSpace * 2),
      height: Math.ceil(rect.height + extraSpace * 2)
    }, "*");
  });
}

/* PLAYLIST HEIGHT LIMIT */

function tmUpdatePlaylistLimit() {

  if (!tmPlaylist.classList.contains("open")) {
    tmPlaylist.style.maxHeight = "150px";
    tmNotifyParentSize();
    return;
  }

  const previousHeight = tm.style.height;

  tm.style.height = "auto";
  tmPlaylist.classList.remove("open");

  const collapsedHeight = tm.getBoundingClientRect().height;

  tmPlaylist.classList.add("open");
  tm.style.height = previousHeight;

  const available = tmParentViewport.height - collapsedHeight - 40;
  const maxHeight = Math.max(50, Math.min(150, available));

  tmPlaylist.style.maxHeight = maxHeight + "px";

  tmNotifyParentSize();
}

/* VINYL ROTATION */

let tmVinylAngle = 0;
let tmLastFrame = null;
let tmAnimationFrame = null;

function tmSpinFrame(timestamp) {
  if (!isPlaying) return;

  if (tmLastFrame !== null) {
    const elapsed = timestamp - tmLastFrame;
    tmVinylAngle = (tmVinylAngle + elapsed * 0.09) % 360;
  }

  tmLastFrame = timestamp;
  tmVinyl.style.transform = `rotate(${tmVinylAngle}deg)`;
  tmAnimationFrame = requestAnimationFrame(tmSpinFrame);
}

function tmSetPlaying(playing) {
  isPlaying = playing;

  if (playing) {
    tmLastFrame = null;
    cancelAnimationFrame(tmAnimationFrame);
    tmAnimationFrame = requestAnimationFrame(tmSpinFrame);
  } else {
    cancelAnimationFrame(tmAnimationFrame);
    tmAnimationFrame = null;
    tmLastFrame = null;
    tmVinyl.style.transform = `rotate(${tmVinylAngle}deg)`;
  }

  tmArtwork.classList.toggle("is-playing", playing);
  tmPlay.textContent = playing ? "Ⅱ" : "▶";
  tmPlay.title = playing ? "Pause" : "Play";
}

function tmFormatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const remaining = Math.floor(seconds % 60);

  return minutes + ":" + String(remaining).padStart(2, "0");
}

/* RENDER PLAYLIST */

function tmRenderPlaylist() {
  tmPlaylist.innerHTML = "";

  tmSongs.forEach((song, index) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "tm-song" + (index === currentSong ? " active" : "");

    const info = document.createElement("span");
    info.className = "tm-song-info";

    const title = document.createElement("span");
    title.className = "tm-song-title";
    title.textContent = song.title;

    const artist = document.createElement("span");
    artist.className = "tm-song-artist";
    artist.textContent = song.artist;

    info.appendChild(title);
    info.appendChild(artist);

    const playingMark = document.createElement("span");
    playingMark.className = "tm-song-playing";
    playingMark.textContent = index === currentSong && isPlaying ? "♫" : "";

    item.appendChild(info);
    item.appendChild(playingMark);

    item.addEventListener("click", () => tmLoadSong(index, true));

    tmPlaylist.appendChild(item);
  });
}

/* LOAD SONG */

function tmLoadSong(index, autoplay = false) {
  currentSong = (index + tmSongs.length) % tmSongs.length;

  const song = tmSongs[currentSong];

  tmSetPlaying(false);
  stallWarningShown = false;

  const bracketText = song.title.match(/\[([^\]]+)\]/g);

  tmTitle.textContent = song.title.replace(/\s*\[[^\]]+\]/g, "").trim();

  if (bracketText) {
    tmSubtitle.textContent = bracketText
      .map(text => text.replace(/[\[\]]/g, ""))
      .join(" • ");

    tmSubtitle.style.display = "block";
  } else {
    tmSubtitle.textContent = "";
    tmSubtitle.style.display = "none";
  }

  tmArtist.textContent = song.artist;
  tmStatus.textContent = autoplay ? "Loading next track..." : "Loading track...";

  tmProgress.value = 0;
  tmCurrent.textContent = "0:00";
  tmDuration.textContent = "0:00";

  knownDuration = 0;
  lastTimeUpdate = Date.now();

  if (tmStallChecker) clearInterval(tmStallChecker);
  tmStallChecker = null;

  tmCover.style.display = "none";
  tmNote.style.display = "block";

  if (song.cover) {
    tmCover.onload = () => {
      tmCover.style.display = "block";
      tmNote.style.display = "none";
    };

    tmCover.onerror = () => {
      tmCover.style.display = "none";
      tmNote.style.display = "block";
    };

    tmCover.src = song.cover;
  } else {
    tmCover.removeAttribute("src");
  }

  tmRenderPlaylist();

  if (whypFrame) {
    whypFrame.remove();
    whypFrame = null;
    whypPlayer = null;
  }

  whypFrame = document.createElement("iframe");
  whypFrame.id = "tm-whyp-frame";
  whypFrame.src = song.embed;
  whypFrame.width = "330";
  whypFrame.height = "200";
  whypFrame.setAttribute("scrolling", "no");
  whypFrame.setAttribute("frameborder", "0");
  whypFrame.setAttribute("allow", "autoplay");

  document.getElementById("tm-whyp-host").appendChild(whypFrame);

  if (typeof playerjs === "undefined") {
    tmStatus.textContent = "Player library failed to load!";
    return;
  }

  const thisPlayer = new playerjs.Player(whypFrame);
  whypPlayer = thisPlayer;

  thisPlayer.on("ready", () => {
    if (whypPlayer !== thisPlayer) return;

    thisPlayer.setVolume(Number(tmVolume.value) / 100);

    if (autoplay) {
      tmStatus.textContent = "Starting playback...";
      thisPlayer.play();
    } else {
      tmStatus.textContent = "Ready!";
    }
  });

  thisPlayer.on("play", () => {
    if (whypPlayer !== thisPlayer) return;

    lastTimeUpdate = Date.now();
    stallWarningShown = false;

    tmSetPlaying(true);
    tmStatus.textContent = "Playing!";
    tmRenderPlaylist();
  });

  thisPlayer.on("pause", () => {
    if (whypPlayer !== thisPlayer) return;

    tmSetPlaying(false);
    tmStatus.textContent = "Paused.";
    tmRenderPlaylist();
  });

  thisPlayer.on("timeupdate", data => {
    if (whypPlayer !== thisPlayer || !data) return;

    lastTimeUpdate = Date.now();
    stallWarningShown = false;

    if (tmStatus.textContent === "Playback may be buffering...") {
      tmStatus.textContent = "Playing!";
    }

    const current = Number(data.seconds) || 0;
    const duration = Number(data.duration) || 0;

    if (duration > 0) knownDuration = duration;

    if (!isSeeking && knownDuration > 0) {
      tmProgress.value = (current / knownDuration) * 100;
    }

    tmCurrent.textContent = tmFormatTime(current);
    tmDuration.textContent = tmFormatTime(knownDuration);
  });

  tmStallChecker = setInterval(() => {
    if (
      whypPlayer === thisPlayer &&
      isPlaying &&
      !stallWarningShown &&
      Date.now() - lastTimeUpdate > 15000
    ) {
      stallWarningShown = true;
      tmStatus.textContent = "Playback may be buffering...";
    }
  }, 2000);

  thisPlayer.on("ended", () => {
    if (whypPlayer !== thisPlayer) return;

    if (isLoop) tmLoadSong(currentSong, true);
    else tmNextSong();
  });

  thisPlayer.on("error", () => {
    if (whypPlayer !== thisPlayer) return;

    tmSetPlaying(false);
    tmStatus.textContent = "Playback error. Check the Whyp track.";
  });
}

/* PLAYBACK CONTROLS */

function tmPlaySong() {
  if (whypPlayer) whypPlayer.play();
}

function tmPauseSong() {
  if (whypPlayer) whypPlayer.pause();
}

tmPlay.addEventListener("click", () => {
  if (isPlaying) tmPauseSong();
  else tmPlaySong();
});

function tmNextSong() {
  if (isShuffle && tmSongs.length > 1) {
    let next;

    do {
      next = Math.floor(Math.random() * tmSongs.length);
    } while (next === currentSong);

    tmLoadSong(next, true);
  } else {
    tmLoadSong(currentSong + 1, true);
  }
}

function tmPreviousSong() {
  tmLoadSong(currentSong - 1, true);
}

document.getElementById("tm-next").addEventListener("click", tmNextSong);
document.getElementById("tm-prev").addEventListener("click", tmPreviousSong);

document.getElementById("tm-shuffle").addEventListener("click", function() {
  isShuffle = !isShuffle;
  this.classList.toggle("active", isShuffle);
});

document.getElementById("tm-loop").addEventListener("click", function() {
  isLoop = !isLoop;
  this.classList.toggle("active", isLoop);
});

/* PLAYLIST TOGGLE */

document.getElementById("tm-playlist-toggle").addEventListener("click", function() {

  tmAnimatePlayerHeight(() => {
    const isOpen = tmPlaylist.classList.toggle("open");

    this.classList.toggle("active", isOpen);

    tmUpdatePlaylistLimit();
  });

});

/* VOLUME TOGGLE */

document.getElementById("tm-volume-toggle").addEventListener("click", function() {

  tmAnimatePlayerHeight(() => {
    const isOpen = tmVolumePanel.classList.toggle("open");

    this.classList.toggle("active", isOpen);
  });

});

/* VOLUME SLIDER */

tmVolume.addEventListener("input", () => {
  const volume = Number(tmVolume.value);

  if (whypPlayer) {
    whypPlayer.setVolume(volume / 100);
  }

  document.getElementById("tm-volume-icon").textContent =
    volume === 0 ? "×" : "♫";
});

/* SEEK BAR */

tmProgress.addEventListener("input", () => {
  isSeeking = true;

  if (knownDuration > 0) {
    const previewTime = (Number(tmProgress.value) / 100) * knownDuration;
    tmCurrent.textContent = tmFormatTime(previewTime);
  }
});

tmProgress.addEventListener("change", () => {
  if (whypPlayer && knownDuration > 0) {
    const targetTime = (Number(tmProgress.value) / 100) * knownDuration;
    whypPlayer.setCurrentTime(targetTime);
  }

  isSeeking = false;
});

/* MINIMIZE, MAXIMIZE, HIDE AND REOPEN */

document.getElementById("tm-minimize").addEventListener("click", function() {

  // Check the player's state BEFORE changing it.
  const wasMinimized = tm.classList.contains("minimized");

  /*
    Only animate the contents when the player is being
    restored from minimized to maximized.
  */
  tmAnimatePlayerHeight(() => {

    tm.classList.toggle("minimized");

    const isMinimized = tm.classList.contains("minimized");

    this.textContent = isMinimized ? "+" : "−";
    this.title = isMinimized ? "Maximize" : "Minimize";

  }, wasMinimized);

});

document.getElementById("tm-hide").addEventListener("click", () => {
  tm.classList.add("hidden");
  tmToggle.classList.add("visible");
  tmNotifyParentSize();
});

tmToggle.addEventListener("click", () => {
  tm.classList.remove("hidden");
  tmToggle.classList.remove("visible");
  tmNotifyParentSize();
});

/* DRAG THE ACTUAL TUMBLR IFRAME */

const header = document.getElementById("tm-header");

let dragging = false;
let previousScreenX = 0;
let previousScreenY = 0;

header.addEventListener("pointerdown", event => {
  if (event.target.closest("button")) return;

  dragging = true;

  previousScreenX = event.screenX;
  previousScreenY = event.screenY;

  tm.classList.add("tm-dragging");

  header.setPointerCapture(event.pointerId);

  window.parent.postMessage({
    type: "tm-player-drag-start"
  }, "*");

  event.preventDefault();
});

header.addEventListener("pointermove", event => {
  if (!dragging) return;

  const dx = event.screenX - previousScreenX;
  const dy = event.screenY - previousScreenY;

  previousScreenX = event.screenX;
  previousScreenY = event.screenY;

  if (dx || dy) {
    window.parent.postMessage({
      type: "tm-player-drag-move",
      dx,
      dy
    }, "*");
  }
});

function tmFinishDragging() {
  if (!dragging) return;

  dragging = false;

  tm.classList.remove("tm-dragging");

  window.parent.postMessage({
    type: "tm-player-drag-end"
  }, "*");
}

header.addEventListener("pointerup", tmFinishDragging);
header.addEventListener("pointercancel", tmFinishDragging);
window.addEventListener("blur", tmFinishDragging);

/* RECEIVE VIEWPORT SIZE FROM TUMBLR */

window.addEventListener("message", event => {
  if (event.source !== window.parent || !event.data) return;

  if (event.data.type === "tm-parent-viewport") {
    tmParentViewport = {
      width: Number(event.data.width) || window.innerWidth,
      height: Number(event.data.height) || window.innerHeight
    };

    if (tmPlaylist.classList.contains("open")) {
      tmUpdatePlaylistLimit();
    }
  }
});

/* KEEP PARENT IFRAME SIZE IN SYNC */

if ("ResizeObserver" in window) {
  const tmObserver = new ResizeObserver(tmNotifyParentSize);

  tmObserver.observe(tm);
  tmObserver.observe(tmToggle);
}

window.addEventListener("load", tmNotifyParentSize);
window.addEventListener("resize", tmNotifyParentSize);

/* START */

tmRenderPlaylist();
tmLoadSong(0, true);
tmNotifyParentSize();

</script>
</body>
</html>
